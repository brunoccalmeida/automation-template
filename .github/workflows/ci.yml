name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the repository
permissions:
  contents: read

# A new push to a PR supersedes the run of the previous commit; runs on
# main are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Validation is offline work: no telemetry, auto-update or other
      # nonessential traffic from the CLI
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node only runs npm's postinstall, which links the CLI's native binary
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/claude-cli/.node-version

      # ci, not install: the lockfile pins the CLI and its platform binary
      # by integrity hash, and a lockfile out of sync fails the step
      - name: Install the pinned Claude Code CLI
        run: npm ci --prefix tools/claude-cli

      # --strict minus one exception: any error or warning fails, except the
      # missing `version` the plugins omit on purpose (ADR 0004). The script
      # validates the marketplace root and every plugin directory, because
      # the root run does not read skill and agent files. Standard library
      # only, on the runner's python3.
      - name: Validate the marketplace and every plugin
        run: |
          tools/claude-cli/node_modules/.bin/claude --version
          python3 .github/scripts/validate_plugins.py

  # The `test` contract. Hooks: each test runs the command the plugin's
  # hooks.json declares, through sh, on synthetic inputs (transcripts, and a
  # cache entry whose repository is a local git repository); Ubuntu's sh is
  # dash, which keeps the hook scripts to POSIX sh. Template: the test runs
  # `copier copy` from this checkout and checks the generated project
  # (ADR 0001: the template is tested by rendering it). The tests need sh,
  # git and copier and fail, never skip, without them.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-checking mode: every package, transitive ones included, must
      # match a pinned hash, and wheels only, so no build script runs (pip
      # docs, "Secure installs"). The venv keeps Copier apart from the
      # runner's system Python.
      - name: Install the pinned Copier
        run: |
          python3 -m venv "$RUNNER_TEMP/copier"
          "$RUNNER_TEMP/copier/bin/pip" install --require-hashes --only-binary :all: -r tools/copier/requirements.txt
          echo "$RUNNER_TEMP/copier/bin" >> "$GITHUB_PATH"

      - name: Test the plugin hooks and the template
        run: |
          copier --version
          python3 -m unittest discover -s tests -v

  # The `test` contract for the ts-playwright pack (#7): the test generates a
  # project with the pack and runs what that project runs (npm ci, check,
  # test, smoke) against a local server, as pawamoy/copier-uv's CI runs its
  # generated project. Apart from the test job because it needs Node and a
  # browser, which the core does not (tests/packs/ has no __init__.py, so
  # the core's discover does not reach it).
  pack-ts-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Node the pack pins for the projects it generates
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: template/.node-version

      - name: Install the pinned Copier
        run: |
          python3 -m venv "$RUNNER_TEMP/copier"
          "$RUNNER_TEMP/copier/bin/pip" install --require-hashes --only-binary :all: -r tools/copier/requirements.txt
          echo "$RUNNER_TEMP/copier/bin" >> "$GITHUB_PATH"

      - name: Test the ts-playwright pack
        run: python3 -m unittest discover -s tests/packs -v

  # The core's enforcement (UTF-8 text, secret scan, workflow audit), the
  # same reusable workflow every generated project gets (#71). A called
  # workflow's job succeeds only when all of its jobs do.
  core-checks:
    # $/: this repository at the running commit, with no checkout (GitHub
    # Docs, "Workflow syntax", uses); zizmor flags "./" (self-repository)
    uses: $/.github/workflows/core-checks.yml
    permissions:
      contents: read

  # The single required check of the ruleset on main (contract `gate`).
  # Requiring each job by name would mean editing the ruleset whenever a job
  # is added or renamed; this job's name never changes. always(): a required
  # check that is skipped counts as passed, and a job skipped because a
  # dependency failed may not block the merge, so the gate must run, and
  # fail, when a dependency fails or is cancelled (GitHub Docs,
  # "Troubleshooting required status checks"). Same shape as the gate of
  # playwright-qa-starter-kit (docs/INVENTORY.md).
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-plugins, test, pack-ts-playwright, core-checks]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job missing from "needs" would not gate the merge. Compare the
      # jobs this gate waited for with every other job of this workflow.
      - name: Require the gate to need every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          expected=$(yq -o=json '.jobs | keys | map(select(. != "ci-passed")) | sort' .github/workflows/ci.yml | jq -c .)
          actual=$(jq -c 'keys | sort' <<< "$NEEDS")
          echo "workflow jobs: $expected"
          echo "gate needs:    $actual"
          test "$expected" = "$actual"

      # Allowlist: only an explicit "success" passes; failure, cancelled and
      # skipped all fail, because a skipped job tested nothing.
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
