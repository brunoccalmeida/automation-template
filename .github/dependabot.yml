# Dependabot version updates. Project-owned: the template renders only the
# core's github-actions block; a pack or the project adds its own ecosystems
# here, because Dependabot reads this one file (ADR 0012). Security updates
# are enabled in the repository settings and ignore the cooldown.
#
# Cooldown: a compromised or broken release is usually taken down within
# days, so version updates wait 7 days; zizmor's dependabot-cooldown audit
# (core-checks.yml, workflow-audit) flags fewer.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Low risk and reviewed together: one PR for all actions
      github-actions:
        patterns: ["*"]

  # The pinned CI tools (.github/tools/; tests/test_ci_tools.py requires an
  # entry for each one). Copier's requirements.txt is compiled by uv with
  # hashes: the uv ecosystem reruns `uv pip compile` with the options it reads
  # from that file (--generate-hashes, --universal, --python-version) and
  # bumps requirements.in too (ADR 0016)
  - package-ecosystem: "uv"
    directory: "/.github/tools/copier"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"

  # Dependabot does not touch allowScripts, which approves the CLI's
  # postinstall for one reviewed version: its pull request fails
  # tests/test_ci_tools.py until the new version is reviewed and approved
  # (the test's message has the command). That blocks the merge, not the
  # script: npm 11 still runs it on the pull request's CI (ADR 0016)
  - package-ecosystem: "npm"
    directory: "/.github/tools/claude-cli"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
