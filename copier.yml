# Copier template configuration (ADR 0001). Copier docs, "Configuring a
# template": https://copier.readthedocs.io/en/stable/configuring/

# The generated project comes from template/ only; the rest of this
# repository (the mission plugin, docs, CI) belongs to the template itself
_subdirectory: template

# The version the template is tested with (.github/tools/copier/)
_min_copier_version: "9.19.1"

project_name:
  type: str
  help: Project name, used as the README title
  validator: "{% if not project_name.strip() %}The project name cannot be empty{% endif %}"

# Rendered on the first copy, then owned by the project: Copier skips them
# when they already exist, so copier update never overwrites what the project
# wrote in them. The rest of template/ belongs to the template and is updated
# by copier update; the project adds its own files instead of editing those.
_skip_if_exists:
  - README.md
  - CLAUDE.md
  - docs/PROJECT_SESSION_SUMMARY.md
  - docs/KNOWN_ISSUES.md
  - docs/adr/README.md
  # The project adds its own jobs to the gate's needs and its own ecosystems
  # to Dependabot, which reads a single file (ADR 0012)
  - .github/workflows/ci.yml
  - .github/dependabot.yml
  # A pack is a walking skeleton (ADR 0002): the project grows every one of
  # its files (dependencies, variables, projects, rules, the smoke itself,
  # which ADR 0003 expects to be replaced), so the pack renders them once
  - package.json
  - package-lock.json
  - .node-version
  - .gitignore
  - .prettierrc.json
  - .prettierignore
  - .env.example
  - tsconfig.json
  - eslint.config.mjs
  - playwright.config.ts
  - osv-scanner.toml
  - "src/**"
  - "scripts/**"
  - "tests/**"

# Each pack's files, left out of a project that did not choose it, and each
# test type's files, left out when the type is not chosen. Patterns are
# rendered with Jinja (Copier docs, "Configuring a template", exclude) and
# matched against the rendered path, without the .jinja suffix (Copier 9.19.1
# source, _main.py: match_exclude(dst_relpath)). With _subdirectory set,
# Copier's default exclude list is empty, so nothing is lost
_exclude:
  - "{% if pack != 'ts-playwright' %}package.json{% endif %}"
  - "{% if pack != 'ts-playwright' %}package-lock.json{% endif %}"
  - "{% if pack != 'ts-playwright' %}.node-version{% endif %}"
  - "{% if pack != 'ts-playwright' %}.gitignore{% endif %}"
  - "{% if pack != 'ts-playwright' %}.prettierrc.json{% endif %}"
  - "{% if pack != 'ts-playwright' %}.prettierignore{% endif %}"
  - "{% if pack != 'ts-playwright' %}.env.example{% endif %}"
  - "{% if pack != 'ts-playwright' %}tsconfig.json{% endif %}"
  - "{% if pack != 'ts-playwright' %}eslint.config.mjs{% endif %}"
  - "{% if pack != 'ts-playwright' %}playwright.config.ts{% endif %}"
  - "{% if pack != 'ts-playwright' %}osv-scanner.toml{% endif %}"
  - "{% if pack != 'ts-playwright' %}src{% endif %}"
  # Anchored: patterns follow gitignore rules, and a bare "scripts" would also
  # drop the core's .github/scripts
  - "{% if pack != 'ts-playwright' %}/scripts{% endif %}"
  - "{% if pack != 'ts-playwright' %}tests{% endif %}"
  - "{% if 'api' not in (test_types or []) %}tests/api{% endif %}"
  - "{% if 'e2e' not in (test_types or []) %}tests/e2e{% endif %}"

# A pack implements the core's contracts for one tool chain (ADR 0002); none
# renders the core alone
pack:
  type: str
  help: The pack for the project's tool chain; none renders the core alone
  choices:
    none: none
    ts-playwright: ts-playwright
  default: none

# Test types are options inside a pack, not packs (ADR 0002). The answer is a
# list (Copier docs, "Configuring a template", multiselect)
test_types:
  type: str
  help: The test types the project starts with
  when: "{{ pack == 'ts-playwright' }}"
  multiselect: true
  choices:
    e2e: e2e
    api: api
  default: "[e2e, api]"
  validator: "{% if not test_types %}Choose at least one test type{% endif %}"

# The contracts of core.md (ADR 0003), rendered into the contracts table of
# the generated CLAUDE.md. A pack answers the commands; left empty, the table
# reads "Not set" and the mission plugin stops and asks. The branch and the
# gate are not empty: the core's own CI and ruleset use them (ADR 0012).
cmd_check:
  type: str
  help: "`check` contract: the command for the static checks (lint, types, formatting); empty if none yet"
  default: "{% if pack == 'ts-playwright' %}npm run check{% endif %}"

cmd_test:
  type: str
  help: "`test` contract: the command that runs the test suite; empty if none yet"
  default: "{% if pack == 'ts-playwright' %}npm test{% endif %}"

cmd_smoke:
  type: str
  help: "`smoke` contract: the fastest end-to-end proof that the project runs; empty if none yet"
  default: "{% if pack == 'ts-playwright' %}npm run smoke{% endif %}"

main_branch:
  type: str
  help: "`main-branch` contract: the branch pull requests merge into"
  default: main
  validator: "{% if not main_branch.strip() %}The main branch cannot be empty{% endif %}"

gate:
  type: str
  help: "`gate` contract: the single CI check the branch ruleset requires, the name of the gate job in .github/workflows/ci.yml"
  default: ci-passed
  # The answer is the gate's job id: "must start with a letter or _ and
  # contain only alphanumeric characters, -, or _" (GitHub Docs, "Workflow
  # syntax", jobs.<job_id>)
  validator: >-
    {% if not (gate | regex_search('^[A-Za-z_][A-Za-z0-9_-]*$')) %}The gate must be a job id: a letter or _, then letters, digits, - or _{% endif %}
